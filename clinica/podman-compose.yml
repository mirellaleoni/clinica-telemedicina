version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: clinica-db
    environment:
      POSTGRES_DB: clinica_db
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: